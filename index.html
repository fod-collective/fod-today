<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070708" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="favicon.svg" />
<title>FOD · Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070708;
    --bg2: #0e0e10;
    --card: rgba(255,255,255,0.035);
    --card-hover: rgba(255,255,255,0.055);
    --stroke: rgba(255,255,255,0.08);
    --stroke2: rgba(232,197,71,0.35);
    --text: #f4f1ea;
    --muted: #8a8680;
    --gold: #e8c547;
    --gold2: #b8922a;
    --sales: #ff6b4a;
    --content: #7aa2ff;
    --deliver: #5ddea5;
    --ops: #c4b5fd;
    --danger: #ff5c7a;
    --shadow: 0 24px 80px rgba(0,0,00.55);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(232,197,71,0.12), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(122,162,255,0.08), transparent 50%),
      radial-gradient(800px 400px at 50% 100%, rgba(93,222,165,0.05), transparent 40%),
      var(--bg);
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 36px 22px 80px; }
  header { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold); font-weight: 600;
  }
  .eyebrow::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 16px var(--gold);
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400; font-size: clamp(42px, 8vw, 64px);
    line-height: 0.95; margin: 0; letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--gold); }
  .sub {
    color: var(--muted); font-size: 16px; line-height: 1.45; max-width: 34ch; margin: 0;
  }
  .topbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; justify-content: space-between;
  }
  .pace {
    display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; width: 100%;
  }
  .stat {
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid var(--stroke); border-radius: 16px; padding: 14px 16px;
    backdrop-filter: blur(12px);
  }
  .stat .k { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
  .stat .v span { color: var(--muted); font-weight: 500; font-size: 14px; }
  .progress-card {
    margin-top: 8px; background: var(--card); border: 1px solid var(--stroke);
    border-radius: var(--radius); padding: 18px 20px; display: flex; gap: 18px; align-items: center;
    box-shadow: var(--shadow);
  }
  .ring {
    --p: 0; width: 72px; height: 72px; border-radius: 50%;
    background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255,255,255,0.08) 0);
    display: grid; place-items: center; flex-shrink: 0;
    position: relative;
  }
  .ring::after {
    content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg2);
  }
  .ring strong { position: relative; z-index: 1; font-size: 15px; font-weight: 700; }
  .progress-copy h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .progress-copy p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .task {
    display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start;
    padding: 18px 18px 18px 16px; border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
    border: 1px solid var(--stroke); transition: border-color .2s, transform .2s, background .2s;
    cursor: pointer; user-select: none;
  }
  .task:hover { border-color: rgba(232,197,71,0.28); background: var(--card-hover); transform: translateY(-1px); }
  .task.done { opacity: 0.45; }
  .task.done .title { text-decoration: line-through; text-decoration-color: rgba(232,197,71,0.5); }
  .check {
    width: 26px; height: 26px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,0.22);
    display: grid; place-items: center; margin-top: 2px; transition: all .15s;
    background: rgba(0,0,0,0.25);
  }
  .task.done .check {
    background: var(--gold); border-color: var(--gold); color: #111;
  }
  .check svg { opacity: 0; width: 14px; height: 14px; }
  .task.done .check svg { opacity: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .time {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--gold); background: rgba(232,197,71,0.1);
    border: 1px solid rgba(232,197,71,0.22); padding: 4px 10px; border-radius: 999px;
  }
  .cat {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; border: 1px solid transparent;
  }
  .cat.sales { color: var(--sales); background: rgba(255,107,74,0.12); border-color: rgba(255,107,74,0.25); }
  .cat.content { color: var(--content); background: rgba(122,162,255,0.12); border-color: rgba(122,162,255,0.25); }
  .cat.deliver { color: var(--deliver); background: rgba(93,222,165,0.12); border-color: rgba(93,222,165,0.25); }
  .cat.ops { color: var(--ops); background: rgba(196,181,253,0.12); border-color: rgba(196,181,253,0.25); }
  .title { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
  .detail { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  footer {
    margin-top: 28px; color: var(--muted); font-size: 12px; letter-spacing: 0.04em;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .focus {
    margin-top: 8px; padding: 16px 18px; border-radius: 18px;
    border: 1px solid var(--stroke2);
    background: linear-gradient(120deg, rgba(232,197,71,0.12), rgba(232,197,71,0.03));
  }
  .focus strong { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow" id="dateLabel">Today</div>
      <div class="topbar">
        <div>
          <h1>Do <em>this</em><br/>today.</h1>
          <p class="sub" id="headline">Your only job is the list below.</p>
        </div>
      </div>
      <div class="pace" id="pace"></div>
      <div class="progress-card">
        <div class="ring" id="ring"><strong id="ringTxt">0%</strong></div>
        <div class="progress-copy">
          <h2 id="doneLabel">0 of 0 locked in</h2>
          <p>Tap a card to mark it done. Resets when CMO refreshes the day.</p>
        </div>
      </div>
      <div class="focus" id="focus"></div>
    </header>
    <section class="list" id="list"></section>
    <footer>
      <span>FOD · Daily Command</span>
      <span id="stamp">—</span>
    </footer>
  </div>
<script>
async function load() {
  const data = {
  "generated_at": "2026-09-26T07:56:00-06:00",
  "timezone": "America/Mexico_City",
  "date_label": "Saturday, Sep 26",
  "headline": "Family day. Board stays quiet.",
  "north_star": {
    "revenue_target": 50000,
    "revenue_now_approx": 20000,
    "clients_target": 4,
    "clients_closed_mtd": null,
    "convos_target": 12,
    "convos_done_mtd": null,
    "convos_note": "Reply with clients closed MTD and conversations held MTD so the scoreboard sticks."
  },
  "tasks": [
    {
      "id": "family-day",
      "time": "All day",
      "title": "Family day — no CREATE, no sales",
      "detail": "Saturday/Sunday are strictly family. Calendar is clear. Film already moved to Fri CREATE. Do not book calls or film blocks today.",
      "category": "ops",
      "priority": 1,
      "done": false
    },
    {
      "id": "belief2-status",
      "time": "Optional 2-min note",
      "title": "Belief 2 — filmed Fri? (mental check only)",
      "detail": "Long-form: You Don’t Have a Client Problem. You Have a Retention Problem. If Fri CREATE slipped, park a Mon film block — not today. CTA stays DM FREEDOM.",
      "category": "content",
      "priority": 2,
      "done": false
    },
    {
      "id": "monday-inputs",
      "time": "Optional phone note",
      "title": "Park Monday’s 3 inputs",
      "detail": "When work resumes Mon: (1) Content CTA DM FREEDOM, (2) 15-min follow-up + book 1 slot, (3) keep weekly floor at 3 conversations. Consistency is the bottleneck — not weekend hustle.",
      "category": "sales",
      "priority": 3,
      "done": false
    }
  ]
};
  const key = 'fod-today-' + (data.date_label || '');
  let doneMap = {};
  try { doneMap = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}

  document.getElementById('dateLabel').textContent = data.date_label || 'Today';
  document.getElementById('headline').textContent = data.headline || '';
  document.getElementById('stamp').textContent = 'Updated ' + (data.generated_at || '');

  const ns = data.north_star || {};
  const fmt = (n) => n == null ? '—' : String(n);
  document.getElementById('pace').innerHTML = `
    <div class="stat"><div class="k">Revenue</div><div class="v">~$${Math.round((ns.revenue_now_approx||0)/1000)}k <span>/ $${Math.round((ns.revenue_target||0)/1000)}k</span></div></div>
    <div class="stat"><div class="k">Clients MTD</div><div class="v">${fmt(ns.clients_closed_mtd)} <span>/ ${fmt(ns.clients_target)}</span></div></div>
    <div class="stat"><div class="k">Convos MTD</div><div class="v">${fmt(ns.convos_done_mtd)} <span>/ ${fmt(ns.convos_target)}</span></div></div>`;

  const tasks = (data.tasks || []).slice().sort((a,b) => (a.priority||9) - (b.priority||9));
  const top = tasks.find(t => !(doneMap[t.id] ?? t.done));
  document.getElementById('focus').innerHTML = top
    ? `<strong>Next up:</strong> ${top.title}`
    : `<strong>Clear.</strong> Day is done — protect tomorrow’s inputs.`;

  const list = document.getElementById('list');
  list.innerHTML = '';

  function render() {
    let doneCount = 0;
    list.innerHTML = '';
    tasks.forEach(t => {
      const done = doneMap[t.id] ?? !!t.done;
      if (done) doneCount++;
      const el = document.createElement('article');
      el.className = 'task' + (done ? ' done' : '');
      el.innerHTML = `
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>
        <div>
          <div class="meta">
            <span class="time">${t.time || ''}</span>
            <span class="cat ${t.category||'ops'}">${t.category||'ops'}</span>
          </div>
          <h3 class="title">${t.title}</h3>
          <p class="detail">${t.detail || ''}</p>
        </div>`;
      el.addEventListener('click', () => {
        doneMap[t.id] = !done;
        localStorage.setItem(key, JSON.stringify(doneMap));
        render();
      });
      list.appendChild(el);
    });
    const pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;
    document.getElementById('ring').style.setProperty('--p', pct);
    document.getElementById('ringTxt').textContent = pct + '%';
    document.getElementById('doneLabel').textContent = `${doneCount} of ${tasks.length} locked in`;
    const top2 = tasks.find(t => !(doneMap[t.id] ?? t.done));
    document.getElementById('focus').innerHTML = top2
      ? `<strong>Next up:</strong> ${top2.title}`
      : `<strong>Clear.</strong> Day is done — protect tomorrow’s inputs.`;
  }
  render();
}
load().catch(err => {
  document.getElementById('headline').textContent = 'Could not load today.json — open this folder via the local server.';
  console.error(err);
});
</script>
</body>
</html>
